spring.datasource.url=jdbc:mysql://localhost:3306/coding_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Shreya@8861
