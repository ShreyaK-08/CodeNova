spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e5b1a7f9e8d2c6b4a0f1e3d5c7b9a1f3e5d7c9b1a3f5e7d9c1b3a5f}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.oj.platform=DEBUG

# Contest exam security (Task 9) - number of fullscreen-exit/tab-switch violations
# allowed before a contest attempt is automatically terminated. Not hardcoded anywhere
# in the application - read via @Value in ContestService.
contest.security.max-violations=3

# AI Chatbot Configuration (Task 13)
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:qwen/qwen3.8-27b}

# DeepL Translation API Configuration
app.deepl.api-key=${DEEPL_API_KEY:}
app.deepl.api-url=${DEEPL_API_URL:https://api-free.deepl.com}

# ---------------------------------------------------------------------------
# Assessment Host Verification - file upload
# ---------------------------------------------------------------------------
# Local-disk directory where uploaded verification documents are stored. Kept
# OUTSIDE the frontend's public folder and outside any static-resource-served
# path - it is only ever reachable through the authenticated, admin-only
# download endpoint (GET /api/admin/assessment-host/verifications/{id}/document).
app.storage.host-verification-dir=${HOST_VERIFICATION_STORAGE_DIR:./storage/host-verification-documents}
app.storage.max-file-size-bytes=${HOST_VERIFICATION_MAX_FILE_SIZE_BYTES:5242880}

# Spring's own multipart limits must be >= the app-level max file size above, or a
# too-large upload is rejected by Spring itself before FileStorageService ever sees it.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# How long a generated verification code stays valid after admin approval.
app.host-verification.code-expiry-minutes=${HOST_VERIFICATION_CODE_EXPIRY_MINUTES:15}

# ---------------------------------------------------------------------------
# Email (SMTP) Configuration - Assessment Host Verification code delivery
# ---------------------------------------------------------------------------
# Left blank by default: if MAIL_HOST is not set, EmailServiceImpl skips sending
# entirely and reports "email delivery unavailable" instead of failing the request -
# no real SMTP account is required for local development or grading.
app.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:noreply@codenova.io}

# ---------------------------------------------------------------------------
# Google OAuth 2.0 Configuration
# ---------------------------------------------------------------------------
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth2/callback/google}

# ---------------------------------------------------------------------------
# Email Verification Settings
# ---------------------------------------------------------------------------
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.email-verification.token-expiry-hours=${EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS:24}